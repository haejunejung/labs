        <title id="state-grid-title">에러 화면에서 정상 화면까지</title>
        <desc id="state-grid-desc">ErrorBoundary 상태와 SuspenseCache의 queryRef 상태를 격자로 놓고, reset만 할 때와 refetch가 끝난 뒤 reset할 때, autoDispose를 기다릴 때 각각 어디로 이동하는지 보여 준다.</desc>
