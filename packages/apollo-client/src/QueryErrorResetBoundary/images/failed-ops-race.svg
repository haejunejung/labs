<path d="M600 384 L628 384 Q636 384 636 392 Q636 400 628 400 L604 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#failed-ops-race-arrow)"/><rect x="644" y="384" width="240" height="16" rx="2" fill="#f5f5f5"/><text x="764.0" y="396.0" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="middle" font-weight="500">목록 = [opB] (opA는 재요청 후 제거)</text>
<path d="M340 440 L596 440" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#failed-ops-race-arrow-link)"/><rect x="430" y="416" width="80" height="16" rx="2" fill="#f5f5f5"/><text x="470.0" y="428" fill="#2e5aa8" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="middle" font-weight="500">B 다시 시도</text>
<path d="M600 480 L836 480" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#failed-ops-race-arrow-link)"/><rect x="680" y="458" width="80" height="14" rx="2" fill="#f5f5f5"/><text x="720.0" y="469" fill="#2e5aa8" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">refetch opB</text>
<rect x="36" y="24" width="168" height="44" rx="6" fill="#f5f5f5"/><rect x="36" y="24" width="168" height="44" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.45"/>
<text x="120" y="44" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="middle" font-weight="600">섹션 A</text>
<text x="120" y="60" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ErrorBoundary A</text>
<rect x="256" y="24" width="168" height="44" rx="6" fill="#f5f5f5"/><rect x="256" y="24" width="168" height="44" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.45"/>
<text x="340" y="44" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="middle" font-weight="600">섹션 B</text>
<text x="340" y="60" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ErrorBoundary B</text>
<rect x="516" y="24" width="168" height="44" rx="6" fill="#f5f5f5"/><rect x="516" y="24" width="168" height="44" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.45"/>
<text x="600" y="44" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="middle" font-weight="600">onError link</text>
<text x="600" y="60" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">global failed ops</text>
