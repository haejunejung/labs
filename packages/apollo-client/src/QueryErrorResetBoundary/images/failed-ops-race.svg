<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="failed-ops-race-title failed-ops-race-desc" id="failed-ops-race-root">
        <title id="failed-ops-race-title">실패한 operation을 모아 다시 요청할 때</title>
        <desc id="failed-ops-race-desc">onError 링크가 실패한 operation을 전역 목록에 모으고 ErrorBoundary가 그 목록을 다시 요청하는 방식에서, B의 에러가 늦게 도착해 사용자가 두 번 눌러야 하고 도착 순서에 따라 A의 재시도가 B의 operation을 요청할 수도 있음을 보여 준다.</desc>
        <defs>
      <style>#failed-ops-race-root { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; color: #2d3142; }
      #failed-ops-race-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#failed-ops-race-root .diagram-container { overflow-x: visible; }
}</style>
  <marker id="failed-ops-race-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="failed-ops-race-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  <marker id="failed-ops-race-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
