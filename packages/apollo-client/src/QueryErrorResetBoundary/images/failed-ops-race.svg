<text x="840" y="44" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="middle" font-weight="600">Network</text>
<text x="840" y="60" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GraphQL server</text>
<line x1="24" y1="556" x2="936" y2="556" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
<text x="24" y="584" fill="#2d3142" font-size="14" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="start">A를 누른 시점에 B의 에러가 아직 없었으므로 A의 재시도는 opA만 요청했고, B는 따로 눌러야 했다.</text>
<text x="24" y="606" fill="#2d3142" font-size="14" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="start">반대로 B의 에러가 먼저 도착했다면 A의 재시도가 opB까지 요청한다. 결과가 도착 순서에 달려 있다.</text>
      </svg>
