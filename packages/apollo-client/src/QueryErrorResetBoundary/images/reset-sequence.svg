<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reset-sequence-title reset-sequence-desc" id="reset-sequence-root">
        <title id="reset-sequence-title">다시 시도를 누르면 일어나는 일</title>
        <desc id="reset-sequence-desc">사용자가 다시 시도를 누르면 ErrorBoundary의 onReset이 QueryErrorResetBoundary의 reset을 불러 새 토큰을 만들고, 다시 렌더된 useSuspenseQuery가 그 토큰을 queryKey에 붙여 SuspenseCache에서 새 queryRef를 받아 다시 요청하는 순서를 보여 준다.</desc>
        <defs>
      <style>#reset-sequence-root { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; color: #2d3142; }
      #reset-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#reset-sequence-root .diagram-container { overflow-x: visible; }
}</style>
  <marker id="reset-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="reset-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  <marker id="reset-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
